<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>
        Registration form
    </h1>
    <form>
        <label>First Name:</label>
        <input type="text" placeholder="enter the  first name">
        <br><br>
         <label>Middle Name:</label>
        <input type="text" placeholder="enter the  middle name">
         <br><br>
         <label>Last Name:</label>
        <input type="text" placeholder="enter the  last name">
         <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"placeholder="enter the email">
         
        <br><br>
        <label>Gender:</label>

        <input type="radio" name="gender" value="male"> Male

        <input type="radio" name="gender" value="female"> Female
         <br><br>
         
<label for="age">Age:</label>
<input type="number" id="age" name="age">
<br><br>

<label for="mobile">Mobile Number:</label>
<input type="tel" id="mobile" name="mobile">
<br><br>

<label for="dob">Date of Birth:</label>
<input type="date" id="dob" name="dob">
<br><br>

 

<label for="country">Country:</label>

<select id="country" name="country">

    <option value="">Select Country</option>

    <option value="india">India</option>
    <option value="usa">USA</option>
    <option value="uk">United Kingdom</option>

</select>
<br><br>

<label for="state">State:</label>

<select id="state" name="state">

    <option value="">Select State</option>
    <option value="up">Uttar Pradesh</option>
    <option value="delhi">Delhi</option>
    <option value="haryana">Haryana</option>
    <option value="rajasthan">Rajasthan</option>

</select>
<br><br>

<label for="city">City:</label>

<input
    type="text"
    id="city"
    name="city"
    placeholder="Enter your city">
<br><br>

<label for="address">Address:</label>

<br>

<textarea
    id="address"
    name="address"
    rows="5"
    cols="40"
    placeholder="Enter your complete address"></textarea>
<br><br>

<label for="pincode">Pincode:</label>

<input
    type="text"
    id="pincode"
    name="pincode"
    placeholder="Enter pincode">
<br><br>

<label>Hobbies:</label>

<br>

<input type="checkbox" id="cricket" name="hobby" value="cricket">
<label for="cricket">Cricket</label>

<input type="checkbox" id="music" name="hobby" value="music">
<label for="music">Music</label>

<input type="checkbox" id="reading" name="hobby" value="reading">
<label for="reading">Reading</label>

<input type="checkbox" id="gaming" name="hobby" value="gaming">
<label for="gaming">Gaming</label>
<br><br>

<label for="photo">Profile Photo:</label>

<input
    type="file"
    id="photo"
    name="photo">
<br><br>

<label for="password">Password:</label>

<input
    type="password"
    id="password"
    name="password"
    placeholder="Enter password">
<br><br>

<label for="confirmPassword">Confirm Password:</label>

<input
    type="password"
    id="confirmPassword"
    name="confirmPassword"
    placeholder="Confirm password">
<br><br>

<input
    type="checkbox"
    id="terms"
    name="terms"
    required>

<label for="terms">
    I agree to the Terms and Conditions
</label>
<br><br><br>

<button type="submit">Register</button>
    <br><br>




    </form>
</body>
</html>
