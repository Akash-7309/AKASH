<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #full{
            height: 705px;
            width: 500px;
            border: 5px solid black;

        }
        .cir{
            border-radius: 50px;
            
            height:70px;
            width: 70px;
            border: 3px solid black;
        }
        .nav{
            height:70px;
            width: 340px;
            border: 3px solid black;
            margin-left: 40px;


        }
        #head{
            padding: 10px;
            height:90px;
           
            display: flex;
             box-sizing: border-box;
        }

        #main{
            border: 5px solid black;
        }
        .card{
            border: 3px solid black;
            height: 180px;
            width: 130px;
            margin:0px auto
            
        }
        #box{
            border: 5px solid black;
            display: flex;
             height: 240px;
             padding-top: 25px;
             box-sizing: border-box;
        }
        #foot{
            height: 90px;
           
        }#banner{
            height: 240px;
            border: 5px solid black;

        }
        img{
            object-fit:cover;
            height: 240px;
            width: 480px;
        }

    </style>
</head>
<body>
   <div id="full">
    <header id ="head">
        <div class="cir"> </div>
        <div class="nav"> </div>
   </header>
    <div id="main">
        <div id="banner">
            <img src="images/radhe.jpg" alt="radhe image">
        </div>
        <div id="box">
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
        </div>
    </div>
    <footer id="foot">

    </footer>
   </div>
    
</body>
</html>
