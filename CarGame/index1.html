<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turbo Road Racer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #1e3a8a);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .game-wrapper {
      width: 100%;
      max-width: 850px;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      background: #0f172a;
      padding: 12px;
      border-radius: 10px 10px 0 0;
      font-weight: bold;
    }

    .top-bar span {
      color: #38bdf8;
    }

    canvas {
      width: 100%;
      max-width: 800px;
      display: block;
      background: #166534;
      border: 4px solid #0f172a;
      touch-action: none;
    }

    #message {
      min-height: 35px;
      background: #0f172a;
      padding: 9px;
      font-weight: bold;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 20px;
      margin: 10px 4px;
      color: white;
      background: #2563eb;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #1d4ed8;
    }

    #restartBtn {
      background: #dc2626;
    }

    .mobile-controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 8px;
    }

    .control-btn {
      width: 75px;
      height: 52px;
      margin: 0;
      font-size: 24px;
      background: #475569;
      user-select: none;
      touch-action: none;
    }

    .control-btn:active {
      background: #0ea5e9;
      transform: scale(0.95);
    }

    .help {
      color: #cbd5e1;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="game-wrapper">
    <h1>🏎️ Turbo Road Racer</h1>

    <div class="top-bar">
      <div>Score: <span id="score">0</span></div>
      <div>Distance: <span id="distance">0</span> m</div>
      <div>Lives: <span id="lives">3</span></div>
      <div>Speed: <span id="speed">0</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="520"></canvas>

    <div id="message">
      Arrow Keys/WASD se car control karein. Space se boost karein.
    </div>

    <button id="restartBtn">🔄 Restart Game</button>

    <div class="mobile-controls">
      <button class="control-btn" id="leftBtn">⬅️</button>
      <button class="control-btn" id="brakeBtn">🛑</button>
      <button class="control-btn" id="rightBtn">➡️</button>
    </div>

    <div class="help">
      Desktop: Arrow Keys / WASD | Boost: Space
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreText = document.getElementById("score");
    const distanceText = document.getElementById("distance");
    const livesText = document.getElementById("lives");
    const speedText = document.getElementById("speed");
    const message = document.getElementById("message");
    const restartBtn = document.getElementById("restartBtn");

    const road = {
      left: 90,
      right: 710,
      width: 620
    };

    const keys = {};

    let player;
    let objects;
    let score;
    let distance;
    let lives;
    let gameRunning;
    let gameWon;
    let lastTime;
    let spawnTimer;
    let roadLineOffset;

    function resetGame() {
      player = {
        x: canvas.width / 2 - 22,
        y: canvas.height - 100,
        width: 44,
        height: 78,
        speed: 5,
        maxSpeed: 10,
        boost: false,
        invincible: 0
      };

      objects = [];
      score = 0;
      distance = 0;
      lives = 3;
      gameRunning = true;
      gameWon = false;
      lastTime = performance.now();
      spawnTimer = 0;
      roadLineOffset = 0;

      message.textContent =
        "Race shuru! Cars aur obstacles se bachkar finish tak pahunchiye.";
      message.style.color = "white";

      requestAnimationFrame(gameLoop);
    }

    function drawRoundedRect(x, y, width, height, radius, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(x, y, width, height, radius);
      ctx.fill();
    }

    function drawRoad() {
      ctx.fillStyle = "#15803d";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#374151";
      ctx.fillRect(road.left, 0, road.width, canvas.height);

      ctx.fillStyle = "#facc15";
      ctx.fillRect(road.left - 7, 0, 7, canvas.height);
      ctx.fillRect(road.right, 0, 7, canvas.height);

      ctx.fillStyle = "#f8fafc";

      const laneWidth = road.width / 4;

      for (let lane = 1; lane < 4; lane++) {
        const x = road.left + laneWidth * lane - 3;

        for (let y = -80 + roadLineOffset; y < canvas.height; y += 100) {
          ctx.fillRect(x, y, 6, 55);
        }
      }

      roadLineOffset += player.speed;
      if (roadLineOffset > 100) roadLineOffset = 0;
    }

    function drawPlayer() {
      if (player.invincible > 0 && Math.floor(player.invincible / 80) % 2 === 0) {
        return;
      }

      drawRoundedRect(
        player.x,
        player.y,
        player.width,
        player.height,
        9,
        "#ef4444"
      );

      drawRoundedRect(
        player.x + 7,
        player.y + 12,
        player.width - 14,
        24,
        5,
        "#bae6fd"
      );

      drawRoundedRect(
        player.x + 8,
        player.y + 48,
        player.width - 16,
        18,
        4,
        "#991b1b"
      );

      ctx.fillStyle = "#111827";
      ctx.fillRect(player.x - 5, player.y + 12, 7, 18);
      ctx.fillRect(player.x + player.width - 2, player.y + 12, 7, 18);
      ctx.fillRect(player.x - 5, player.y + 50, 7, 18);
      ctx.fillRect(player.x + player.width - 2, player.y + 50, 7, 18);

      if (player.boost) {
        ctx.fillStyle = "#facc15";
        ctx.beginPath();
        ctx.moveTo(player.x + 13, player.y + player.height);
        ctx.lineTo(player.x + 22, player.y + player.height + 25);
        ctx.lineTo(player.x + 31, player.y + player.height);
        ctx.fill();
      }
    }

    function drawEnemy(obj) {
      drawRoundedRect(
        obj.x,
        obj.y,
        obj.width,
        obj.height,
        8,
        obj.color
      );

      drawRoundedRect(
        obj.x + 7,
        obj.y + 10,
        obj.width - 14,
        22,
        4,
        "#cbd5e1"
      );

      ctx.fillStyle = "#111827";
      ctx.fillRect(obj.x - 4, obj.y + 13, 6, 18);
      ctx.fillRect(obj.x + obj.width - 2, obj.y + 13, 6, 18);
      ctx.fillRect(obj.x - 4, obj.y + 48, 6, 18);
      ctx.fillRect(obj.x + obj.width - 2, obj.y + 48, 6, 18);
    }

    function drawObstacle(obj) {
      ctx.fillStyle = "#f97316";
      ctx.fillRect(obj.x, obj.y, obj.width, obj.height);

      ctx.fillStyle = "#fef3c7";

      for (let i = -20; i < obj.width + 20; i += 28) {
        ctx.save();
        ctx.translate(obj.x + i, obj.y);
        ctx.rotate(-0.6);
        ctx.fillRect(0, 0, 9, obj.height + 15);
        ctx.restore();
      }

      ctx.strokeStyle = "#7c2d12";
      ctx.lineWidth = 3;
      ctx.strokeRect(obj.x, obj.y, obj.width, obj.height);
    }

    function drawCoin(obj) {
      ctx.fillStyle = "#facc15";
      ctx.beginPath();
      ctx.arc(
        obj.x + obj.width / 2,
        obj.y + obj.height / 2,
        obj.width / 2,
        0,
        Math.PI * 2
      );
      ctx.fill();

      ctx.fillStyle = "#92400e";
      ctx.font = "bold 18px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("$", obj.x + obj.width / 2, obj.y + obj.height / 2);
    }

    function spawnObject() {
      const laneWidth = road.width / 4;
      const lane = Math.floor(Math.random() * 4);

      const x = road.left + lane * laneWidth + laneWidth / 2 - 22;
      const typeRandom = Math.random();

      if (typeRandom < 0.5) {
        objects.push({
          type: "enemy",
          x: x,
          y: -100,
          width: 44,
          height: 78,
          speed: 1 + Math.random() * 2,
          color: ["#2563eb", "#9333ea", "#14b8a6", "#eab308"][
            Math.floor(Math.random() * 4)
          ]
        });
      } else if (typeRandom < 0.78) {
        objects.push({
          type: "obstacle",
          x: x - 5,
          y: -50,
          width: 54,
          height: 28,
          speed: 0
        });
      } else {
        objects.push({
          type: "coin",
          x: x + 12,
          y: -35,
          width: 24,
          height: 24,
          speed: 0
        });
      }
    }

    function isColliding(a, b) {
      const padding = 7;

      return (
        a.x + padding < b.x + b.width &&
        a.x + a.width - padding > b.x &&
        a.y + padding < b.y + b.height &&
        a.y + a.height - padding > b.y
      );
    }

    function updatePlayer() {
      const left = keys["ArrowLeft"] || keys["a"] || keys["A"];
      const right = keys["ArrowRight"] || keys["d"] || keys["D"];
      const brake = keys["ArrowDown"] || keys["s"] || keys["S"];
      const boost = keys[" "];

      player.boost = Boolean(boost);

      let currentSpeed = player.speed;

      if (player.boost) {
        currentSpeed = 13;
      }

      if (brake) {
        currentSpeed = 3;
      }

      if (left) {
        player.x -= 7;
      }

      if (right) {
        player.x += 7;
      }

      player.x = Math.max(
        road.left + 10,
        Math.min(road.right - player.width - 10, player.x)
      );

      return currentSpeed;
    }

    function updateObjects(currentSpeed, delta) {
      for (let i = objects.length - 1; i >= 0; i--) {
        const obj = objects[i];

        obj.y += currentSpeed + obj.speed;

        if (isColliding(player, obj)) {
          if (obj.type === "coin") {
            score += 50;
            objects.splice(i, 1);
            continue;
          }

          if (player.invincible <= 0) {
            lives--;
            player.invincible = 1500;
            player.x = canvas.width / 2 - player.width / 2;
            score = Math.max(0, score - 100);

            message.textContent = "💥 Collision! Lives remaining: " + lives;
            message.style.color = "#f87171";

            objects.splice(i, 1);

            if (lives <= 0) {
              endGame(false);
              return;
            }
          }
        }

        if (obj.y > canvas.height + 120) {
          objects.splice(i, 1);
          score += 5;
        }
      }

      if (player.invincible > 0) {
        player.invincible -= delta;
      }
    }

    function drawObjects() {
      for (const obj of objects) {
        if (obj.type === "enemy") drawEnemy(obj);
        if (obj.type === "obstacle") drawObstacle(obj);
        if (obj.type === "coin") drawCoin(obj);
      }
    }

    function updateUI(currentSpeed) {
      scoreText.textContent = score;
      distanceText.textContent = Math.floor(distance);
      livesText.textContent = lives;
      speedText.textContent = Math.floor(currentSpeed * 10);
    }

    function endGame(won) {
      gameRunning = false;
      gameWon = won;

      if (won) {
        message.textContent =
          "🏆 Race complete! Final Score: " + score;
        message.style.color = "#4ade80";
      } else {
        message.textContent =
          "💀 Game Over! Restart karke dobara try karein.";
        message.style.color = "#f87171";
      }
    }

    function gameLoop(time) {
      if (!gameRunning) {
        drawRoad();
        drawObjects();
        drawPlayer();
        return;
      }

      const delta = time - lastTime;
      lastTime = time;

      const currentSpeed = updatePlayer();

      distance += currentSpeed * 0.035;
      spawnTimer += delta;

      if (spawnTimer > 700) {
        spawnObject();
        spawnTimer = 0;
      }

      updateObjects(currentSpeed, delta);

      if (distance >= 3000 && gameRunning) {
        endGame(true);
      }

      drawRoad();
      drawObjects();
      drawPlayer();
      updateUI(currentSpeed);

      requestAnimationFrame(gameLoop);
    }

    function setKey(key, value) {
      keys[key] = value;
    }

    window.addEventListener("keydown", function(event) {
      keys[event.key] = true;

      if (
        ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(
          event.key
        )
      ) {
        event.preventDefault();
      }
    });

    window.addEventListener("keyup", function(event) {
      keys[event.key] = false;
    });

    function setupTouchButton(buttonId, key) {
      const button = document.getElementById(buttonId);

      button.addEventListener("pointerdown", function(event) {
        event.preventDefault();
        setKey(key, true);
      });

      button.addEventListener("pointerup", function(event) {
        event.preventDefault();
        setKey(key, false);
      });

      button.addEventListener("pointerleave", function() {
        setKey(key, false);
      });

      button.addEventListener("pointercancel", function() {
        setKey(key, false);
      });
    }

    setupTouchButton("leftBtn", "ArrowLeft");
    setupTouchButton("rightBtn", "ArrowRight");
    setupTouchButton("brakeBtn", "ArrowDown");

    restartBtn.addEventListener("click", resetGame);

    resetGame();
  </script>
</body>
</html>
